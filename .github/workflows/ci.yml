name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CRAB_TEST_S3_ENDPOINT: http://127.0.0.1:9000
      CRAB_TEST_S3_KEY: crabtest
      CRAB_TEST_S3_SECRET: crabtestsecret
    defaults:
      run:
        working-directory: s3
    steps:
      - uses: actions/checkout@v4
        with:
          path: s3
      # Tested against the framework's main, which composer.json reads from ../framework; a release requires ^0.7 of it.
      - uses: actions/checkout@v4
        with:
          repository: crabphp/framework
          path: framework
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, simplexml
          coverage: none
      # RustFS speaks S3 as MinIO does; MinIO no longer publishes its server image. Pinned, so a new release cannot break CI unseen.
      - run: |
          docker run -d -p 9000:9000 -e RUSTFS_ACCESS_KEY=crabtest -e RUSTFS_SECRET_KEY=crabtestsecret rustfs/rustfs:1.0.4
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:9000/health && break; sleep 1; done
      - run: composer install --no-interaction --no-progress
      - run: composer format:check
      - run: composer lint
      - run: vendor/bin/phpunit
